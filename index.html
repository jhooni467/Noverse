<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09252b">
  <meta name="description" content="NOVERSE: Explore. Play. Discover.">
  <title>NOVERSE</title>
  <link rel="manifest" href="manifest.json?v=0.2.2">
  <link rel="stylesheet" href="css/styles.css?v=0.4.1">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🪐</span>
      <span>NOVERSE</span>
    </div>
    <button class="settings" type="button" aria-label="Configuración" title="Próximamente">⚙</button>
  </header>

  <main class="main-content">
    <section class="welcome">
      <p class="eyebrow">GAME HUB · EXPLORA TU PRÓXIMO JUEGO</p>
      <h1>¿Qué quieres<br>descubrir hoy?</h1>
      <p>Un nuevo juego, una nueva experiencia.</p>
    </section>

    <section class="featured">
      <div class="section-heading">
        <h2>Destacados</h2>
        <span>Explora</span>
      </div>
      <div id="featured-games" class="featured-grid"></div>
    </section>

    <section class="catalog">
      <div class="section-heading">
        <h2>Todos los juegos</h2>
        <span id="game-count">0 juegos</span>
      </div>
      <nav id="categories" class="categories" aria-label="Categorías de juegos"></nav>
      <div id="games-grid" class="games-grid"></div>
    </section>
  </main>

  <section id="game-screen" class="game-screen" aria-label="Pantalla del minijuego" hidden>
    <header class="game-topbar">
      <button id="game-back" class="game-back" type="button" aria-label="Volver al catálogo">←</button>
      <h1 id="game-title">Minijuego</h1>
      <span class="game-brand-mark" aria-hidden="true">🪐</span>
    </header>
    <div id="game-root" class="game-root" aria-live="polite"></div>
  </section>

  <p id="game-notice" class="game-notice" role="status" hidden></p>

  <footer>
    <span>NOVERSE</span>
    <p>Explore. Play. Discover. ✦</p>
  </footer>

  <script src="core/game-manager.js"></script>
  <script src="games/registry.js"></script>
  <script src="games/star-catcher.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(error => console.error("Offline:", error));
      });
    }
  </script>
</body>
</html>
