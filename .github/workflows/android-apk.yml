name: Build NOVERSE Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore the same debug signing key for test updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: noverse-v1-debug-signing-key

      - name: Install dependencies
        run: npm install

      - name: Verify sources (syntax, versions, offline cache, Store and Android config)
        run: npm run verify

      - name: Build web assets and native bridge
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Apply Android system-bar integration
        run: node scripts/patch-android.mjs

      - name: Set app version
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 118/; s/versionName .*/versionName "1.18"/' android/app/build.gradle

      - name: Build installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../NOVERSE-v1.18.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVERSE-v1.18-APK
          path: NOVERSE-v1.18.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with direct APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.18
          name: NOVERSE v1.18
          body: |
            NOVERSE v1.18 — Android release.

            - APK instalable directamente.
            - Integración nativa de barra de estado, navegación del sistema, pantalla de inicio y retroceso Android.
            - Vibración háptica en controles principales.
            - Icono nativo adaptativo de NOVERSE.
            - Música ambiental original para cada juego, con control de silencio.
            
            Esta es una compilación de prueba (debug), no una publicación de producción.
          files: NOVERSE-v1.18.apk
          overwrite_files: true
          make_latest: true
