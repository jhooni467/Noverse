name: Build NOVERSE Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Keep the same debug signing key for APK updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: noverse-v1-debug-signing-key
      - name: Install dependencies
        run: npm install
      - name: Copy web app
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Set app version
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 100/; s/versionName .*/versionName "1.00"/' android/app/build.gradle
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Upload APK
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: NOVERSE-v1.00-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
